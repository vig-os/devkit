# Composite action to run project-level checks
#
# This action is self-contained and handles:
# - Checks out repository code
# - Sets up the environment (uv, Python deps, BATS) via setup-env
# - Runs pre-commit linters (ruff, shellcheck, pymarkdown, etc.)       [lint]
# - Runs BATS shell script tests                                      [bats]
# - Runs the lightweight project tests (all of tests/ except the Nix/image-heavy
#   modules, which have their own targeted jobs) plus the vig-utils package
#   tests, with the coverage report and job summary                   [pytest]
# - Runs the flake gates: Tier 0 nix-fast-build, flake output schema, dev-shell
#   contracts, hooks fidelity + services, capability modules, the downstream
#   stub, and the zizmor audit of the managed workflow set            [flake]
#
# `suite` selects ONE of those blocks; 'all' runs every one of them. This action
# is the single source of truth for each block body: the four CI lanes that run
# them in parallel (ci.yml `project-lint` / `project-tests` / `project-bats` /
# `project-flake`) differ only in the `suite` they pass. An unrecognized `suite`
# is refused up front rather than silently running nothing. Refs #1692.
#
# Inputs:
#   suite: Which block to run (all | lint | bats | pytest | flake). Default: 'all'
#   test-args: Arguments to pass to pytest (default: '-v -s --tb=short')
#
# Usage:
#   # Run every block in one job (includes coverage)
#   - uses: ./.github/actions/test-project
#
#   # Run one block (what each CI lane does)
#   - uses: ./.github/actions/test-project
#     with:
#       suite: 'lint'      # or 'bats', 'pytest', 'flake'

name: 'Test Project'
description: 'Run project-level checks: linters, tests, code coverage'

inputs:
  suite:
    description: 'Which block to run: all | lint | bats | pytest | flake'
    required: false
    default: 'all'

  test-args:
    description: 'Arguments to pass to pytest'
    required: false
    default: '-v -s --tb=short'

  cachix-cache:
    description: 'Cachix binary cache name (passed to flake provisioning)'
    required: false
    default: ''

  cachix-auth-token:
    description: 'Cachix auth token (optional; pulls need no token)'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Fail fast on an unknown suite. Every block is guarded on an exact match, so
    # a typo ('flakes', 'tests') would silently run NOTHING and report the lane
    # green — the one failure mode a per-lane split introduces that the serial
    # chain could not have. Refs #1692.
    - name: Validate suite
      shell: bash
      env:
        SUITE: ${{ inputs.suite }}
      run: |
        set -euo pipefail
        case "$SUITE" in
          all | lint | bats | pytest | flake) ;;
          *)
            echo "::error::unknown test-project suite '$SUITE' (expected: all, lint, bats, pytest, flake)"
            exit 1
            ;;
        esac

    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Set up test environment
      uses: ./.github/actions/setup-env
      with:
        # taplo and BATS come from the flake (the toolchain SSoT). Refs #632, #720.
        # The bats block wants the flake toolchain but never the project venv:
        # no BATS test executes `uv` (init.bats only probes `command -v uv`, the
        # `uv sync` strings are heredoc payloads, and just.bats/init-workspace.bats
        # stub the binary), so it skips the sync. Derived from `suite` rather than
        # exposed as an input: the environment a block needs is a property of the
        # block, not a caller's choice. Refs #1692.
        sync-dependencies: ${{ inputs.suite == 'bats' && 'false' || 'true' }}
        cachix-cache: ${{ inputs.cachix-cache }}
        cachix-auth-token: ${{ inputs.cachix-auth-token }}

    - name: Cache prek hooks
      if: inputs.suite == 'all' || inputs.suite == 'lint'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/prek
        key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          prek-${{ runner.os }}-

    - name: Run prek linters
      if: inputs.suite == 'all' || inputs.suite == 'lint'
      shell: bash
      run: |
        set -euo pipefail
        export PATH="$HOME/.local/bin:$PATH"

        # prek is the git-hook runner (from the flake devTools, on PATH via the
        # provisioned dev-shell); it runs the whole committed config, including
        # the impure hooks not covered by `checks.pre-commit`. Refs #778.
        prek --version

        echo "Running prek hooks on all files..."
        prek run --all-files --show-diff-on-failure --color=always

    # --- BATS shell script tests ---------------------------------------------
    - name: Run BATS shell script tests
      if: inputs.suite == 'all' || inputs.suite == 'bats'
      shell: bash
      run: |
        set -euo pipefail
        echo "Running BATS tests with $(nproc) jobs..."
        # Jobs within files; GNU parallel rides with the bats wrapper. Refs #1687
        bats -j "$(nproc)" tests/bats/

    # --- Project tests with coverage (suite: all | pytest) -------------------
    - name: Run project tests with coverage
      if: inputs.suite == 'all' || inputs.suite == 'pytest'
      shell: bash
      env:
        TEST_ARGS: ${{ inputs.test-args }}
      run: |
        # Run every lightweight shape test under tests/ by default (#1061):
        # `tests/` minus an explicit, slow-changing deny-list of the heavy Nix
        # modules (flake checks/devshell/hooks/modules/services, downstream
        # flake) or those needing a built image + podman (image / install /
        # integration), each covered by its own targeted step or job
        # (nix-checks, test-image, test-integration). test_flake_version_guard
        # stays in the sweep: it needs only the provisioned dev shell this lane
        # already has (#1413). New shape-test files are picked up automatically
        # — no edit to this list required.
        uv run pytest \
          tests/ \
          --ignore=tests/test_downstream_flake.py \
          --ignore=tests/test_flake_checks.py \
          --ignore=tests/test_flake_devshell.py \
          --ignore=tests/test_flake_hooks.py \
          --ignore=tests/test_flake_modules.py \
          --ignore=tests/test_flake_services.py \
          --ignore=tests/test_image.py \
          --ignore=tests/test_install_script.py \
          --ignore=tests/test_integration.py \
          packages/vig-utils/tests \
          --cov --cov-report=term-missing --cov-report=xml \
          $TEST_ARGS

    - name: Generate coverage summary
      if: always() && (inputs.suite == 'all' || inputs.suite == 'pytest')
      shell: bash
      run: |
        if [ ! -f coverage.xml ]; then
          echo "::warning::No coverage report generated"
          echo "## Code Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "No coverage report was generated." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        # Parse coverage.xml and write a summary table to the job summary
        python3 - <<'PYEOF'
        import xml.etree.ElementTree as ET
        import os

        tree = ET.parse("coverage.xml")
        root = tree.getroot()
        total_rate = float(root.attrib.get("line-rate", 0)) * 100

        lines = []
        lines.append(f"## Code Coverage: {total_rate:.1f}%\n")
        lines.append("| File | Statements | Missing | Coverage |")
        lines.append("|------|-----------|---------|----------|")

        for pkg in root.findall(".//package"):
            for cls in pkg.findall(".//class"):
                filename = cls.attrib.get("filename", "")
                stmts = len(cls.findall(".//line"))
                misses = len(
                    [l for l in cls.findall(".//line") if l.attrib.get("hits") == "0"]
                )
                rate = float(cls.attrib.get("line-rate", 0)) * 100
                lines.append(f"| `{filename}` | {stmts} | {misses} | {rate:.1f}% |")

        summary = "\n".join(lines) + "\n"
        summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "")
        if summary_file:
            with open(summary_file, "a") as f:
                f.write(summary)
        else:
            print(summary)
        PYEOF

    - name: Upload coverage report
      if: always() && (inputs.suite == 'all' || inputs.suite == 'pytest')
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: coverage-report
        path: coverage.xml
        retention-days: 30
        if-no-files-found: warn

    # --- Flake gates (suite: all | flake) ------------------------------------
    # Tier 0 (#779): evaluate + build every `checks.<system>` derivation in
    # parallel with an eval cache via nix-fast-build — the pure formatting
    # (treefmt), deadnix/statix, dev-shell build, devShellTools eval, and the
    # git-hooks.nix `pre-commit` gate. Faster than serial `nix flake check`;
    # nix-fast-build evaluates through nix-eval-jobs, so eval/type errors still
    # surface. The runner is amd64, so target x86_64-linux explicitly. The
    # effectful checks (image testinfra, integration, vulnix CVE-DB, the impure
    # pre-commit hooks) stay GH-orchestrated in their own jobs. Refs #674, #779.
    - name: Check flake quality gates (Tier 0 — nix-fast-build)
      if: inputs.suite == 'all' || inputs.suite == 'flake'
      shell: bash
      run: nix run .#nix-fast-build -- --skip-cached --no-nom --flake ".#checks.x86_64-linux"

    # Validate the flake OUTPUT SCHEMA that nix-fast-build (which only builds
    # `checks`) does not exercise: the treefmt formatter, the checks attrset
    # names, the `install` app, and the nixos/homeManager modules. Cheap evals;
    # the slow `nix flake check` build is covered by nix-fast-build above. #779.
    - name: Validate flake output schema
      if: inputs.suite == 'all' || inputs.suite == 'flake'
      shell: bash
      run: uv run pytest tests/test_flake_checks.py -k "not flake_check_succeeds" -v

    # Guard the dev-shell <-> image parity: the dev-shell's own PATH must
    # provide `python3` + the vig-utils release scripts (#729/#993, one
    # probe: own_path_binaries), carry the `prek` hook runner in the devTools
    # SSoT (#778), must NOT leak the Nix C++ runtime onto an FHS host's
    # LD_LIBRARY_PATH (#703), and must provide the fixture-driven tool/env
    # contracts (bats + helper libs, prek binary hooks, pymarkdown, uv python
    # pinning, agent-toolkit superset). These drive `nix develop` directly
    # (not covered by `test-project`'s pytest scope), so run them explicitly
    # here where Nix + the dev profile are warm. The NixOS-gated and
    # build-heavy cases (per-tool sweep, python override matrix) stay
    # local-only. Refs #729, #703, #778, #1413, #1417.
    - name: Check dev-shell contracts (parity, leak-guard, tool/env fixtures)
      if: inputs.suite == 'all' || inputs.suite == 'flake'
      shell: bash
      run: |
        uv run pytest tests/test_flake_devshell.py \
          -k "own_path_binaries or hook_runner_is_prek or no_nix_cxx_runtime_leak \
              or provides_bats or provides_precommit_binary_hooks or provides_pymarkdown \
              or bats_lib_path or uv_python or superset_of_agent_toolkit" -v

    # Run the git-hooks fidelity gate (nix/hooks.nix <-> committed YAML, the
    # consumer hooks/hooksExcludes surface, workflow branch-guards, gitleaks
    # opt-in) and the services-module contracts. Previously these two modules
    # ran in no CI job at all despite being deny-listed from the test-project
    # sweep as "covered by their own targeted jobs". The services PoC boot
    # (live s3 + postgres) stays local-only. Refs #1413.
    - name: Check git-hooks fidelity gate + services module
      if: inputs.suite == 'all' || inputs.suite == 'flake'
      shell: bash
      run: |
        uv run pytest tests/test_flake_hooks.py tests/test_flake_services.py \
          -k "not services_poc_boots" -v

    # Run the capability-module contract tests (#884): the `native` module
    # shell exposes the C/C++ toolchain on its own PATH and exports generic
    # CC/CXX, plus the C-extension sdist smoke. nix-fast-build above already
    # builds `checks.*.module-native`, so `nix develop` is warm; the sdist
    # smoke needs PyPI, which this lane already uses (setup-env runs
    # `uv sync`), so it is included rather than deselected. Refs #884.
    - name: Check capability-module contracts (native)
      if: inputs.suite == 'all' || inputs.suite == 'flake'
      shell: bash
      run: uv run pytest tests/test_flake_modules.py -v

    # Validate the scaffolded downstream stub (assets/workspace/flake.nix)
    # against THIS toolchain, not the published vigos, so a change to the flake
    # API (lib.mkProjectShell / overlays.default) can't silently break a
    # downstream repo's `direnv allow`. Refs #640.
    - name: Check downstream flake stub
      if: inputs.suite == 'all' || inputs.suite == 'flake'
      shell: bash
      run: nix flake check ./assets/workspace --override-input vigos "path:$PWD" --accept-flake-config

    # Audit the devkit-managed workflow set (assets/workspace/.github/workflows/)
    # against the shipped zizmor baseline (zizmor.yml). Gates regressions: a new
    # zizmor finding — or a managed workflow that regains a fixed finding — fails
    # here and must be fixed in the workflow or triaged in zizmor.yml, so
    # consumers never inherit an unbaselined finding from devkit's output. The
    # baseline scopes exemptions to managed basenames only, so consumer-authored
    # workflows are never suppressed. Refs #1182.
    - name: Audit managed workflows (zizmor)
      if: inputs.suite == 'all' || inputs.suite == 'flake'
      shell: bash
      run: uvx zizmor@1.25.2 --offline --config zizmor.yml assets/workspace/.github/workflows/
