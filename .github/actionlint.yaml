---
# actionlint configuration — runner labels this repo's workflows may name.
#
# Mirrors the config the scaffold ships to consumers
# (assets/workspace/.github/actionlint.yaml, #1660); devkit needs its own copy
# because its workflows are not scaffolded. Keep the two in step.
#
# actionlint rejects any LITERAL `runs-on:` label missing from its built-in
# list, and this file is the only way to teach it one. Expression forms are
# unaffected — `runs-on: ${{ fromJSON(...) }}` is skipped by actionlint
# entirely.
#
# Keep this list MINIMAL. Every label added is a label actionlint will no longer
# flag as a typo, so each earns its place with a reason and is deleted once that
# reason expires.
self-hosted-runner:
  labels:
    # Hosted runners actionlint's built-in list predates. actionlint 1.7.12 is
    # the latest upstream release (2026-03-30) and the ubuntu-26.04 images
    # shipped after it, so no pin bump recognises these. DELETE BOTH once an
    # actionlint release knows them. Refs #1660, #1658.
    - ubuntu-26.04
    - ubuntu-26.04-arm
