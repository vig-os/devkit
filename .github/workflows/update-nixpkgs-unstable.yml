# Scheduled bump of the fast-branch flake inputs: nixpkgs-unstable and
# home-manager-unstable (home-manager master).
#
# The fastMovers overlay (uv, gh, claude-code, typst, typstyle, tinymist) tracks
# nixpkgs-unstable. Typst tool bumps change document output; this lock pin
# controls when consumers receive them and fresh claude-code versions
# (ADR-home-environment-modules rejects third-party claude-code flakes). The
# home-manager-unstable pin feeds the ci-hm-unstable eval guard (#1589) — a
# stale pin would make that guard test a frozen master snapshot, so both bump
# together. This workflow refreshes the pins weekly on a chore branch and
# opens a PR to dev — the full CI pipeline on that PR is the merge gate, and
# where a home-manager master break against the vigos.* modules surfaces.
#
# Refs #817, #1589.
name: Update nixpkgs-unstable

on:  # yamllint disable-line rule:truthy
  schedule:
    # Mondays 05:00 UTC — lands before the work week, CI gates the merge.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bump:
    name: Bump nixpkgs-unstable lock
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3
        with:
          client-id: ${{ secrets.COMMIT_APP_CLIENT_ID }}
          private-key: ${{ secrets.COMMIT_APP_PRIVATE_KEY }}

      - name: Checkout dev
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: dev
          token: ${{ steps.generate-token.outputs.token }}

      - name: Record checkout SHA
        id: checkout-state
        # actions/checkout reports the SHA it checked out; no git call, so this
        # also works before a container job marks the workspace safe (#2055).
        env:
          CHECKOUT_SHA: ${{ steps.checkout.outputs.commit }}
        run: |
          set -euo pipefail
          test -n "$CHECKOUT_SHA" || { echo "::error::actions/checkout reported no commit SHA"; exit 1; }
          echo "sha=$CHECKOUT_SHA" >> "$GITHUB_OUTPUT"

      - name: Install Nix (upstream CppNix)
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24  # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Update the nixpkgs-unstable and home-manager-unstable inputs
        run: nix flake update nixpkgs-unstable home-manager-unstable

      - name: Detect lock change
        id: detect
        run: |
          set -euo pipefail
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "flake.lock unchanged - nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or reset the chore branch at dev HEAD
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/chore/update-nixpkgs-unstable" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/chore/update-nixpkgs-unstable" \
              -f sha="$sha" -F force=true >/dev/null
          else
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/chore/update-nixpkgs-unstable" -f sha="$sha" >/dev/null
          fi

      # Commit via the GitHub API (vig-os/commit-action) so the commit carries
      # GitHub's verified signature - the repo rules reject unsigned git-CLI
      # pushes.
      - name: Require pinned commit base for API write 1
        if: steps.detect.outputs.changed == 'true'
        env:
          BASE_SHA: ${{ steps.checkout-state.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$BASE_SHA" || { echo "::error::BASE_SHA is empty; refusing unpinned API commit"; exit 1; }

      - name: Commit the lock bump via API
        if: steps.detect.outputs.changed == 'true'
        uses: vig-os/commit-action@7ba7e1ae17547813e708d4cc6a771a09f978f724  # v0.3.3
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: refs/heads/chore/update-nixpkgs-unstable
          BASE_SHA: ${{ steps.checkout-state.outputs.sha }}
          MAX_ATTEMPTS: "3"
          COMMIT_MESSAGE: "chore(nix): bump nixpkgs-unstable + home-manager master"
          FILE_PATHS: flake.lock

      # PR creation needs pull-requests: write, which the commit app does not
      # have (least-privilege split: COMMIT_APP_* commits, RELEASE_APP_* does
      # PR operations). Same two-app pattern as sync-main-to-dev.yml (#817).
      - name: Generate Release App Token
        if: steps.detect.outputs.changed == 'true'
        id: release-app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Open PR if none exists
        if: steps.detect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          set -euo pipefail
          if ! gh pr list --head chore/update-nixpkgs-unstable --base dev --state open \
              --json number --jq '.[0].number' | grep -q .; then
            body="$(printf 'Scheduled refresh of the fast-branch pins: nixpkgs-unstable (uv, gh, claude-code, typst, typstyle, tinymist via the fastMovers overlay) and home-manager master (the ci-hm-unstable eval guard). Typst tool bumps change document output: review rendered PDF/hash drift, compile compatibility, and typstyle formatting changes before adopting. Full CI on this PR is the merge gate.\n\nRefs: #817, #1589, #1993\n')"
            gh pr create --base dev --head chore/update-nixpkgs-unstable \
              --title "chore(nix): bump nixpkgs-unstable + home-manager master" \
              --body "$body"
          fi
