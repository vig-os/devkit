---
# Release-neutral lane — the proof half (#1676).
#
# `main` can only be written by a release: `prepare-release` and
# `prepare-hotfix` are the only lanes, and both cut a tag, publish a GHCR image
# and trigger `devkit-upgrade` adoption PRs across every consumer repo. But
# plenty of changes belong on `main` while changing NOTHING a consumer
# receives — devkit's own `.github/workflows/**` (not the scaffolded copy under
# `assets/workspace/`), `tests/**`, most of `docs/**`, the scan-time registers.
# For those, a release republishes a functionally identical artifact and hands
# every consumer a pin bump that changes nothing they run.
#
# This lane merges them without a release. `release-neutral-open.yml` proposes
# the PR; this workflow decides whether it is genuinely release-neutral.
#
# THE CONTRACT IS GATE 2. Equal derivation paths mean the published artifacts
# CANNOT differ, whatever the diff touched. That is a proof, not an argument
# about which files happen to be inputs — and deliberately not a path
# allowlist, which would encode a guess about what is published and need
# extending for every new kind of release-neutral change.
#
# Gate 2 covers BOTH consumption modes. A devcontainer consumer pulls
# `devkitImage`; a `direnv`/`bare` consumer never does — it evaluates
# `devShells.default` straight from the flake — so an image-only comparison
# would wave through a change that alters every such consumer's toolchain.
#
# GATE 2 COMPARES A NORMALIZED TREE. `CHANGELOG.md` is mirrored by a pre-commit
# hook into `assets/workspace/.devcontainer/CHANGELOG.md`, which is baked into
# the image, so a release note ALONE moves the image derivation. Measured on
# this branch against `main` at 2026-09-24:
#
#   the raw tree (it carries a CHANGELOG.md entry)
#     -> devkitImage d5gf56y0... != main's d6ikbz96...      REFUSED
#   the same tree, changelog and mirror reverted to main's copy
#     -> devkitImage d6ikbz96... == main's d6ikbz96...      ADMITTED
#
# So gate 2 reverts those two files to the base's copy before evaluating: both
# sides then hold identical changelog text and any surviving difference is
# genuinely non-changelog. Without it no change carrying a release note could
# ever ride the lane — which is nearly all of them — and the lane would be
# bypassed by hand every time.
#
# That rests on a project decision superseding #590's invariant: `main` MAY
# carry changes that have landed but are not yet shipped, and its
# `## Unreleased` section describes them. `sync-main-to-dev.yml` triggers on
# `push: [main]`, so the entry reaches `dev` by itself and the next train
# freezes it normally. Hence gate 1 refuses only `.vig-os` (it carries
# DEVKIT_VERSION — editing that IS releasing), and the former gate 4, which
# asserted main's `## Unreleased` was empty, is deleted rather than relaxed.
# The drift is reported in the verdict instead, so it stays visible.
#
# TWO SHAPE RULES, both load-bearing:
#
#   1. The `guard` job carries NO job-level `if`. A job-level condition yields a
#      SKIPPED job, and were this guard ever promoted to a required status check,
#      a skipped job on a release PR would leave that PR waiting forever on a
#      check that never reports. "Inactive" must mean *ran and passed*, so the
#      label scoping lives on the steps.
#   2. The gates are LABEL-scoped, never diff-scoped. A release PR legitimately
#      changes `CHANGELOG.md`, `.vig-os` AND the scaffold, so a guard keyed on
#      the diff shape would fail every release.
#
# It also never writes: `main` sets `dismiss_stale_reviews_on_push`, so a guard
# that pushed to the PR branch would discard the very approval the lane depends
# on (GitHub forbids authors approving their own PRs and no App holds bypass on
# `main`, so that approval is the only way a lane PR ever merges).
#
# Refs: #1676
name: Release-Neutral Guard

on:  # yamllint disable-line rule:truthy
  pull_request:
    branches:
      - main
    # `labeled`/`unlabeled` matter: the label activates the gates, so a guard
    # that only ran on `opened`/`synchronize` would report a stale pass on a PR
    # labelled after it was opened.
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

concurrency:
  group: release-neutral-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: Release-Neutral Guard
    runs-on: ubuntu-26.04
    # Gate 2 is eval-only (seconds). The budget is for the content-triggered
    # vulnix extra, which may rebuild `main`'s closure against a cold NVD
    # cache — the nightly leg budgets 90 minutes for the same work.
    timeout-minutes: 90
    permissions:
      contents: read        # verify only — never author (see header)
      pull-requests: write  # gate 6 posts the verdict comment
      actions: read         # the vulnix extra's fast path reads the nightly artifact
    env:
      # Single evaluation of the lane's discriminator. Steps test `env.ACTIVE`;
      # the job itself stays unconditional so it always reports a conclusion.
      ACTIVE: ${{ contains(github.event.pull_request.labels.*.name, 'release-neutral') }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}

    steps:
      # Unconditional by design: this is what makes "inactive" a SUCCESS rather
      # than a skip. See shape rule 1 in the header.
      - name: Report scope
        run: |
          set -euo pipefail
          if [ "${ACTIVE}" = "true" ]; then
            echo "Lane ACTIVE — this PR carries the \`release-neutral\` label; proving release-neutrality." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Lane inactive — no \`release-neutral\` label, so this is an ordinary PR to \`main\` (a release PR, say) and the gates do not apply." \
              >> "$GITHUB_STEP_SUMMARY"
            echo "Add the \`release-neutral\` label to activate the guard." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout the merge result
        if: env.ACTIVE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Gates 1-3 diff against `main` and gate 2 checks it out, so the full
          # history is required rather than the default shallow clone.
          fetch-depth: 0
          persist-credentials: false

      # ── Gate 1 — no release content ──────────────────────────────────────
      # A forbidden set, NOT an allowlist: changing these files *is* releasing.
      # `.vig-os` is the whole set — it carries DEVKIT_VERSION, and writing a
      # version is the one edit no proof can make release-neutral. The changelog
      # is deliberately absent: `main` may carry an entry for a change it has
      # landed but not shipped, and gate 2 normalizes the text away before
      # comparing so the entry proves nothing about neutrality either way.
      - name: 'Gate 1: no release content in the diff'
        if: env.ACTIVE == 'true'
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          echo "Changed files:"
          awk '{print "  " $0}' <<< "$changed"
          rc=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              .vig-os)
                echo "::error::gate 1: \`$f\` is release content — it carries DEVKIT_VERSION, so changing it is releasing rather than a release-neutral change. Leave version edits out of the cherry-pick; they belong to a real train."
                rc=1
                ;;
            esac
          done <<< "$changed"
          [ "$rc" -eq 0 ] || exit 1
          echo "✓ gate 1: no release content touched"

      # ── Gate 3 — scaffold untouched ──────────────────────────────────────
      # Formally subsumed by gate 2 (the scaffold is copied into the image), but
      # kept for diagnostics: naming the offending file beats two unequal store
      # hashes. Runs before gate 2 so the cheap, legible failure comes first.
      #
      # ONE EXCLUSION, and it is not cosmetic: `CHANGELOG.md` is mirrored to
      # `assets/workspace/.devcontainer/CHANGELOG.md`. Gate 1 admits the
      # changelog and gate 2 normalizes it away before comparing, so a gate 3
      # that refused `assets/` wholesale would reject every changelog-carrying
      # PR anyway and quietly undo that. The mirror is regenerated from
      # CHANGELOG.md by the `sync-manifest` hook, so it is never independently
      # authored and needs no separate scrutiny here.
      - name: 'Gate 3: consumer scaffold untouched'
        if: env.ACTIVE == 'true'
        run: |
          set -euo pipefail
          scaffold=(assets/ ':(exclude)assets/workspace/.devcontainer/CHANGELOG.md')
          if ! git diff --quiet "origin/${BASE_REF}...HEAD" -- "${scaffold[@]}"; then
            echo "::error::gate 3: the diff changes the consumer scaffold under assets/ — that is a published asset and needs a release:"
            git diff --name-only "origin/${BASE_REF}...HEAD" -- "${scaffold[@]}" \
              | awk '{print "  " $0}'
            exit 1
          fi
          echo "✓ gate 3: assets/ byte-identical to ${BASE_REF} (changelog mirror excluded)"

      # ── Gate 5 — release-train interlock ─────────────────────────────────
      # `main`'s required checks are strict (branch must be up to date), so
      # moving `main` while a train is in flight forces the release PR to
      # re-satisfy up-to-date-ness, which dismisses its human approval.
      - name: 'Gate 5: no release train in flight'
        if: env.ACTIVE == 'true'
        run: |
          set -euo pipefail
          trains=$(git ls-remote --heads origin 'refs/heads/release/*' | awk '{print $2}')
          if [ -n "$trains" ]; then
            echo "::error::gate 5: a release train is in flight:"
            awk '{print "  " $0}' <<< "$trains"
            echo "::error::Moving main now would dismiss that train's approval. Promote or abandon it first."
            exit 1
          fi
          echo "✓ gate 5: no release/* branch in flight"

      - name: Set up environment (Nix + flake toolchain)
        if: env.ACTIVE == 'true'
        uses: ./.github/actions/setup-env
        with:
          sync-dependencies: 'true'
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # ── Gate 2 — derivation identity (THE CONTRACT) ──────────────────────
      # Eval-only, so seconds rather than a build. Every published output is
      # compared, covering both consumption modes (see header).
      #
      # NORMALIZED: the changelog and its mirror are reverted to the base's copy
      # before the head side is evaluated, so both sides hold identical
      # changelog text and any surviving difference is genuinely non-changelog.
      # This works without a commit because `nix eval .#…` on a DIRTY git tree
      # evaluates the working tree, not the checked-out revision.
      - name: 'Gate 2: published derivations identical to main'
        if: env.ACTIVE == 'true'
        run: |
          set -euo pipefail
          system=$(nix eval --impure --raw --expr 'builtins.currentSystem')
          attrs="devShells.${system}.default packages.${system}.devkitImage packages.${system}.devkitImageEnv"
          changelogs=(CHANGELOG.md assets/workspace/.devcontainer/CHANGELOG.md)

          git checkout "origin/${BASE_REF}" -- "${changelogs[@]}"
          if git diff --quiet HEAD -- "${changelogs[@]}"; then
            echo "Normalization: no changelog drift to neutralize"
          else
            echo "Normalization: changelog reverted to ${BASE_REF}'s copy for the comparison"
          fi
          declare -A head_drv
          for attr in $attrs; do
            head_drv["$attr"]=$(nix eval --raw ".#${attr}.drvPath")
          done
          # Restore immediately: every later step (the vulnix extra's diff, the
          # verdict's file list) must read the real head tree.
          git checkout HEAD -- "${changelogs[@]}"

          git checkout -q "origin/${BASE_REF}"
          declare -A base_drv
          for attr in $attrs; do
            base_drv["$attr"]=$(nix eval --raw ".#${attr}.drvPath")
          done
          git checkout -q -

          rc=0
          for attr in $attrs; do
            if [ "${head_drv[$attr]}" = "${base_drv[$attr]}" ]; then
              echo "  ✓ ${attr}"
              echo "      ${base_drv[$attr]}"
            else
              echo "::error::gate 2: ${attr} derivation CHANGED — this is not a release-neutral change and needs a release. The changelog is already excluded from this comparison, so the difference is elsewhere in the diff."
              echo "    base: ${base_drv[$attr]}"
              echo "    head: ${head_drv[$attr]}"
              rc=1
            fi
          done
          [ "$rc" -eq 0 ] || exit 1
          echo "✓ gate 2: every published derivation byte-identical to ${BASE_REF} (changelog normalized)"
          {
            echo "### Gate 2 — published derivations (changelog normalized)"
            echo
            for attr in $attrs; do
              echo "- \`${attr}\` → \`${base_drv[$attr]}\` (unchanged)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Content-triggered extra: scan-register safety ────────────────────
      # NOT part of the lane's contract — one extra check that fires on content.
      #
      # The scan registers are release-neutral (gate 2 proves it), but they are
      # not append-only: a pin advance on `dev` CLEARS exceptions, and `dev`'s
      # pin advances first, so there is always a window where `dev` has
      # correctly deleted an exception that `main`'s older, still-vulnerable
      # closure depends on. Carrying that deletion would strand a real finding
      # and turn `main`'s nightly lane red. So when the diff touches
      # `.vulnixignore`, replay `main`'s own gate and read the exit code rather
      # than reasoning about whether the removal was safe.
      - name: 'Extra: main stays green under the proposed register'
        if: env.ACTIVE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet "origin/${BASE_REF}...HEAD" -- .vulnixignore; then
            echo "Skipped: the diff does not touch .vulnixignore"
            exit 0
          fi

          reg="${RUNNER_TEMP}/proposed.vulnixignore"
          cp .vulnixignore "$reg"

          git checkout -q "origin/${BASE_REF}"
          main_sha=$(git rev-parse HEAD)

          findings=""
          run_id=$(gh run list --workflow=security-scan.yml -L 20 \
            --json databaseId,headSha \
            --jq "[.[] | select(.headSha == \"$main_sha\")] | .[0].databaseId // empty")
          if [ -n "$run_id" ]; then
            echo "Fast path: nightly run $run_id scanned this exact main SHA ($main_sha)"
            if gh run download "$run_id" -n nix-image-cve-scan-main \
                 -D "${RUNNER_TEMP}/nightly" 2>/dev/null; then
              findings="${RUNNER_TEMP}/nightly/vulnix-findings.json"
            else
              echo "::warning::artifact unavailable (likely expired); falling back to a full rebuild"
            fi
          fi

          if [ -z "$findings" ]; then
            echo "Slow path: rebuilding main's closure and rescanning"
            nix build .#devkitImageEnv --print-build-logs
            NVD_MIRROR="https://vig-os.github.io/nvd-mirror/"
            rc=0
            for attempt in 1 2 3; do
              rc=0
              nix run .#vulnix -- --mirror "$NVD_MIRROR" --closure ./result --json \
                > "${RUNNER_TEMP}/vulnix-findings.json" || rc=$?
              [ "$rc" -le 2 ] && jq -e . "${RUNNER_TEMP}/vulnix-findings.json" > /dev/null 2>&1 && break
              if [ "$attempt" -lt 3 ]; then
                echo "::warning::vulnix attempt ${attempt} failed (exit ${rc}); retrying"
                sleep $((60 * attempt))
              fi
            done
            # shellcheck disable=SC2015  # the error branch must fire whenever the scan-ok check fails
            [ "$rc" -le 2 ] && jq -e . "${RUNNER_TEMP}/vulnix-findings.json" > /dev/null 2>&1 \
              || { echo "::error::vulnix scan failed after 3 attempts (exit $rc)"; exit 1; }
            findings="${RUNNER_TEMP}/vulnix-findings.json"
          fi

          if ! uv run vulnix-gate "$findings" --register "$reg"; then
            echo "::error::main would be RED with this register. The CVEs above are present in main's closure and unexcepted by the proposed register — most likely an exception was deleted that main's older pin still needs."
            exit 1
          fi
          git checkout -q -
          echo "✓ extra: main's closure is green under the proposed register"

      # ── Gate 6 — verdict comment ─────────────────────────────────────────
      - name: 'Gate 6: post the verdict'
        if: env.ACTIVE == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # No checkout here: gates 2 and the vulnix extra each restore the head
          # tree themselves, so `-` would point at the base and the file list
          # below would come out empty.
          changed=$(git diff --name-only "origin/${BASE_REF}...HEAD")
          {
            echo "### Release-neutral guard — verdict"
            echo
            echo "**This change is release-neutral.** Every published derivation is byte-identical to \`${BASE_REF}\`, so merging it changes nothing any consumer receives and no release is required."
            echo
            echo "| Gate | Proved |"
            echo "|------|--------|"
            echo "| 1 | No release content (\`.vig-os\`, which carries \`DEVKIT_VERSION\`) touched |"
            echo "| 2 | \`devShells.default\`, \`devkitImage\`, \`devkitImageEnv\` derivations unchanged, compared with the changelog normalized |"
            echo "| 3 | Consumer scaffold under \`assets/\` byte-identical |"
            echo "| 5 | No release train in flight |"
            echo
            echo "**Files carried to \`main\`:**"
            while IFS= read -r f; do [ -n "$f" ] && echo "- \`$f\`"; done <<< "$changed"
            echo
            # Gate 2 normalizes the changelog away, so a release note passes the
            # contract SILENTLY. Silence is the failure mode: the reviewer could
            # not otherwise tell a workflows-only carry from one that also
            # rewrites main's `## Unreleased`. So say it, conditioned on the
            # diff, and show what lands.
            if git diff --quiet "origin/${BASE_REF}...HEAD" -- CHANGELOG.md assets/workspace/.devcontainer/CHANGELOG.md; then
              echo "**Changelog.** Untouched — nothing for gate 2 to normalize."
            else
              echo "**Changelog drift — the one published difference.** This PR edits \`CHANGELOG.md\` (and its \`assets/workspace/.devcontainer/\` mirror), which is baked into the image. Gate 2 therefore **normalized it away**: both sides were evaluated with \`${BASE_REF}\`'s changelog, so the identity proved above covers everything *except* the changelog text."
              echo
              echo "That is allowed by design — \`main\` may carry changes it has landed but not shipped, and \`## Unreleased\` is where they are described (superseding [#590](https://github.com/vig-os/devkit/issues/590)). \`sync-main-to-dev.yml\` fires on \`push: [main]\`, so the entry reaches \`dev\` on its own and the next train freezes it normally. Read the entry before approving:"
              echo
              echo '```diff'
              git diff "origin/${BASE_REF}...HEAD" -- CHANGELOG.md
              echo '```'
            fi
            if ! git diff --quiet "origin/${BASE_REF}...HEAD" -- .vulnixignore; then
              echo
              echo "> This PR amends \`.vulnixignore\`. The substantive record of the risk acceptance is the register block itself, which reaches \`main\` with this merge; the changelog entry above is its release note — 10 of the last 12 register commits carried one, so do not let this be the exception."
            fi
            echo
            echo "> Do not push to this branch after approving — \`main\` sets \`dismiss_stale_reviews_on_push\`."
          } > "${RUNNER_TEMP}/verdict.md"
          cat "${RUNNER_TEMP}/verdict.md" >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR_NUMBER" --body-file "${RUNNER_TEMP}/verdict.md"
