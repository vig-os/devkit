# Seeded by vigOS devkit — yours to edit; upgrades never overwrite this file.
# Bugs / missing tools: https://github.com/vig-os/devkit/issues

# cargo-deny policy: the Rust pack's base (devkit #1496), scaffold-once. Its
# presence turns on mkRustProject's `deny` check, which runs `bans licenses
# sources` in the Nix sandbox. Advisories need the network, so they run outside
# it: `cargo deny check advisories` in CI or by hand.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences only. Add a copyleft licence here deliberately, with the
# reason in a comment, never to make the check pass.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[licenses.private]
# Workspace crates with `publish = false` are not distributed, so their own
# licence field is not policed.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
